<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D4F46">
<meta name="description" content="중학교 1학년 과학 7개 단원 단원평가, 제출 즉시 채점">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="과학1 단원평가">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>과학 1 단원평가 기록보관소</title>
<style>
@font-face{font-family:"Gowun Batang";font-weight:400;font-style:normal;font-display:swap;src:url("./fonts/GowunBatang-Regular.woff2") format("woff2")}
@font-face{font-family:"Gowun Batang";font-weight:700;font-style:normal;font-display:swap;src:url("./fonts/GowunBatang-Bold.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans KR";font-weight:400;font-style:normal;font-display:swap;src:url("./fonts/IBMPlexSansKR-Regular.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans KR";font-weight:500;font-style:normal;font-display:swap;src:url("./fonts/IBMPlexSansKR-Medium.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans KR";font-weight:600;font-style:normal;font-display:swap;src:url("./fonts/IBMPlexSansKR-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Nanum Pen Script";font-weight:400;font-style:normal;font-display:swap;src:url("./fonts/NanumPenScript-Regular.woff2") format("woff2")}
.appbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--sheet);padding:10px 12px 10px 16px;border-radius:6px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);font-size:14.5px;max-width:calc(100% - 28px)}
.appbar button{border:1.5px solid var(--sheet);background:var(--sheet);color:var(--ink);border-radius:4px;padding:6px 12px;font-weight:600;white-space:nowrap}
.appbar button.x{background:transparent;color:var(--sheet);border-color:transparent;padding:6px 8px}
.offline-tag{font-size:12.5px;color:var(--graphite);text-align:center;margin-top:28px}
@media print{.appbar{display:none!important}}
:root{
  --paper:#E4E9DF; --sheet:#F7F8F3; --ink:#1C2B3A; --graphite:#5A6168; --rule:#C3CBBE;
  --manila:#D8C387; --manila-ink:#4E3F16; --drawer:#3D4F46; --drawer-hi:#4B6055; --brass:#B08D45;
  --red:#B8322A; --ok:#2F6B4F; --shade:rgba(28,43,58,.14);
  --serif:"Gowun Batang","Noto Serif KR","AppleMyungjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --pen:"Nanum Pen Script","Gowun Batang",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C2521; --sheet:#25302B; --ink:#E4E9E1; --graphite:#A6B0A8; --rule:#3A4741;
    --manila:#BCA769; --manila-ink:#2B230C; --drawer:#31433A; --drawer-hi:#3C5147; --brass:#C9A55E;
    --red:#E46A5F; --ok:#73C29A; --shade:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#1C2521; --sheet:#25302B; --ink:#E4E9E1; --graphite:#A6B0A8; --rule:#3A4741;
  --manila:#BCA769; --manila-ink:#2B230C; --drawer:#31433A; --drawer-hi:#3C5147; --brass:#C9A55E;
  --red:#E46A5F; --ok:#73C29A; --shade:rgba(0,0,0,.35);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 64px}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.3;margin:0}
.muted{color:var(--graphite)}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:11px 20px;border-radius:4px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 표지 ---------- */
.cover{min-height:100%;display:grid;place-items:center;padding:40px 18px}
.cover-inner{max-width:560px;width:100%}
.cover h1{font-size:clamp(30px,6vw,44px);letter-spacing:-.5px}
.cover .sub{margin:10px 0 28px;color:var(--graphite)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;box-shadow:0 1px 0 var(--rule),0 10px 24px -14px var(--shade);position:relative}
.libcard{padding:26px 24px 22px;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);background-position:0 58px}
.libcard .hole{position:absolute;left:50%;bottom:10px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);transform:translateX(-50%)}
.libcard h2{font-size:19px;margin-bottom:18px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.fields .full{grid-column:1/-1}
.fld label{display:block;font-size:13px;color:var(--graphite);margin-bottom:3px}
.fld input,.fld select{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:6px 2px;font-family:var(--pen);font-size:26px;line-height:1.1}
.fld select{font-family:var(--sans);font-size:16px;padding:9px 2px}
.err{color:var(--red);font-size:14px;min-height:22px;margin-top:8px}
.cover .go{margin-top:6px;width:100%}

/* ---------- 서가 ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between;margin-bottom:22px}
.who{font-family:var(--pen);font-size:26px;line-height:1}
.who small{font-family:var(--sans);font-size:13px;color:var(--graphite);margin-left:6px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools select{border:1.5px solid var(--rule);background:var(--sheet);border-radius:4px;padding:8px 10px}
.shelf-title{font-size:clamp(24px,4vw,32px);margin:4px 0 4px}
.shelf-note{color:var(--graphite);margin:0 0 24px;max-width:62ch}
.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;background:var(--drawer);padding:18px;border-radius:6px;box-shadow:inset 0 0 0 3px var(--drawer-hi)}
.drawer{background:linear-gradient(180deg,var(--drawer-hi),var(--drawer));border-radius:4px;padding:16px 16px 14px;color:#EEF1EA;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.25)}
.labelholder{background:var(--brass);padding:4px;border-radius:3px;width:max-content;max-width:100%;margin:0 auto 10px}
.labelholder span{display:block;background:var(--manila);color:var(--manila-ink);font-family:var(--serif);font-weight:700;padding:6px 14px;font-size:17px;text-align:center}
.drawer .code{text-align:center;font-size:12.5px;opacity:.75;margin-bottom:12px}
.handle{width:62px;height:10px;border-radius:0 0 10px 10px;background:var(--brass);margin:0 auto 14px;opacity:.9}
.slips{display:grid;gap:8px}
.slip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--sheet);color:var(--ink);border:0;border-left:5px solid var(--manila);border-radius:2px;padding:10px 12px;transition:transform .15s}
.slip:hover{transform:translateX(3px)}
.slip b{font-family:var(--serif)}
.slip .best{font-size:13px;color:var(--graphite);white-space:nowrap}
.slip .best.done{color:var(--red);font-family:var(--pen);font-size:22px;line-height:1}

/* ---------- 시험지 ---------- */
.examhead{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1.5px solid var(--ink);padding:10px 0 8px}
.examhead .wrap{padding-top:0;padding-bottom:0}
.eh-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eh-title{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.3}
.eh-title small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--graphite)}
.timer{font-family:var(--serif);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--red)}
.timer small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--graphite);display:block;text-align:right}
.ticks{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tick{flex:1 0 26px;height:26px;border:1.5px solid var(--rule);background:var(--sheet);font-size:12px;border-radius:2px;padding:0}
.tick.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.tick.sa{border-style:dashed}
.sheet{background:var(--sheet);border:1px solid var(--rule);margin-top:20px;padding:28px clamp(16px,4vw,44px) 36px;box-shadow:0 12px 30px -20px var(--shade)}
.sheet-head{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:3px double var(--ink);padding-bottom:12px;margin-bottom:8px}
.sheet-head h2{font-size:clamp(20px,3.4vw,26px)}
.sheet-head .meta{font-size:13.5px;color:var(--graphite)}
.namebox{border:1.5px solid var(--ink);padding:6px 12px;font-family:var(--pen);font-size:24px;line-height:1.2;align-self:start;white-space:nowrap}
.part{font-family:var(--serif);font-size:18px;margin:26px 0 4px;padding-top:8px}
.part small{font-family:var(--sans);font-size:13px;color:var(--graphite);font-weight:400;margin-left:6px}
.q{padding:18px 0;border-bottom:1px solid var(--rule);position:relative}
.q:last-child{border-bottom:0}
.qt{display:grid;grid-template-columns:34px 1fr;gap:4px}
.qn{font-family:var(--serif);font-weight:700;font-size:18px;position:relative}
.qs{font-weight:500;max-width:70ch}
.pts{color:var(--graphite);font-weight:400;font-size:13.5px;white-space:nowrap}
.data{margin:10px 0 6px 34px;border:1px solid var(--ink);padding:10px 14px;font-size:15px;white-space:pre-wrap;max-width:68ch;overflow-x:auto}
.data table{border-collapse:collapse;white-space:nowrap}
.data td,.data th{border:1px solid var(--graphite);padding:4px 10px;text-align:center}
.data th{background:var(--paper);font-weight:600}
.bogi{margin:10px 0 6px 34px;border:1px solid var(--ink);padding:16px 14px 10px;position:relative;max-width:68ch}
.bogi::before{content:"보기";position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--sheet);padding:0 10px;font-family:var(--serif);font-size:14px}
.bogi div{padding-left:1.6em;text-indent:-1.6em;margin-bottom:4px}
.opts{list-style:none;margin:10px 0 0 34px;padding:0;display:grid;gap:4px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:3px;cursor:pointer;position:relative}
.opt:hover{background:var(--paper)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .no{flex:0 0 1.6em;font-size:17px;line-height:1.5}
.opt input:checked + .no{color:var(--sheet);background:var(--ink);border-radius:50%;text-align:center;width:1.6em;height:1.6em;line-height:1.6em;font-size:15px}
.opt input:focus-visible + .no{outline:3px solid var(--brass);outline-offset:2px;border-radius:50%}
.sa-box{margin:10px 0 0 34px}
.sa-box textarea{width:100%;min-height:140px;resize:vertical;border:1px solid var(--graphite);background:transparent;padding:10px 12px;font-family:var(--pen);font-size:24px;line-height:34px;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);background-attachment:local}
.sa-box .cnt{font-size:12.5px;color:var(--graphite);text-align:right}
.submitbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;background:rgba(15,22,19,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal .card{max-width:440px;width:100%;padding:24px}
.modal h3{font-size:20px;margin-bottom:8px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* ---------- 결과 ---------- */
.result-top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;border-bottom:3px double var(--ink);padding-bottom:18px}
.stamp{width:150px;height:150px;border:5px solid var(--red);border-radius:50%;color:var(--red);display:grid;place-items:center;text-align:center;transform:rotate(-12deg);font-family:var(--serif);font-weight:700;opacity:0}
.stamp.hit{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) .25s forwards}
.stamp .sc{font-size:46px;line-height:1}
.stamp .lb{font-size:13px;letter-spacing:.5px;border-top:2px solid var(--red);padding-top:2px;margin-top:4px}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.2)}60%{opacity:.95;transform:rotate(-12deg) scale(.94)}100%{opacity:.9;transform:rotate(-12deg) scale(1)}}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.sum{border-left:3px solid var(--manila);padding:4px 10px}
.sum b{display:block;font-family:var(--serif);font-size:22px}
.sum span{font-size:13px;color:var(--graphite)}
.mark{position:absolute;left:-6px;top:-10px;width:46px;height:46px;pointer-events:none}
.mark path,.mark circle{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:draw .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.opt.r-pick .no{text-decoration:line-through}
.opt.r-ans{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.r-ans .no::after{content:" 정답";font-size:12px;color:var(--ok);white-space:nowrap}
.opt.r-wrong{background:color-mix(in srgb,var(--red) 12%,transparent)}
.review .opt{cursor:default}
.pen{font-family:var(--pen);color:var(--red);font-size:23px;line-height:1.25;margin:8px 0 0 34px}
.expl{margin:8px 0 0 34px;font-size:14.5px;color:var(--graphite);max-width:68ch}
.myans{margin:10px 0 0 34px;border:1px dashed var(--graphite);padding:8px 12px;font-family:var(--pen);font-size:23px;line-height:1.35;white-space:pre-wrap;min-height:44px}
.rubric{margin:10px 0 0 34px;border-collapse:collapse;font-size:14px;max-width:68ch;width:calc(100% - 34px)}
.rubric td{border-top:1px solid var(--rule);padding:6px 6px;vertical-align:top}
.rubric td:first-child{width:28px;text-align:center}
.rubric td:last-child{width:54px;text-align:right;white-space:nowrap}
.rubric .y{color:var(--ok);font-weight:700}
.rubric .n{color:var(--red);font-weight:700}
.model{margin:8px 0 0 34px;font-size:14.5px;border-left:3px solid var(--ok);padding:4px 10px;max-width:68ch}
.notice{font-size:13.5px;color:var(--graphite);margin-top:10px}
.filter{display:flex;gap:6px;margin:18px 0 0;flex-wrap:wrap}
.filter button{border:1.5px solid var(--rule);background:var(--sheet);padding:6px 12px;border-radius:20px;font-size:14px}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* ---------- 기록 ---------- */
.logtbl{width:100%;border-collapse:collapse;font-size:14.5px}
.savestate{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13.5px;padding:3px 10px;border-radius:20px;border:1.5px solid var(--rule);color:var(--graphite)}
.savestate::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--graphite)}
.savestate.ok{border-color:var(--ok);color:var(--ok)}.savestate.ok::before{background:var(--ok)}
.savestate.wait::before{background:var(--brass)}
.logtools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.logtbl th,.logtbl td{border-bottom:1px solid var(--rule);padding:8px 8px;text-align:left;white-space:nowrap}
.logtbl th{font-family:var(--serif)}
.tblwrap{overflow-x:auto}

@media (max-width:600px){
  .fields{grid-template-columns:1fr 1fr}
  .result-top{grid-template-columns:1fr}
  .stamp{width:120px;height:120px;justify-self:end;margin-top:-10px}
  .stamp .sc{font-size:38px}
  .data,.bogi,.opts,.sa-box,.pen,.expl,.myans,.model{margin-left:0}
  .rubric{margin-left:0;width:100%}
  .sheet-head{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .stamp.hit{animation:none;opacity:.9}
  .mark path,.mark circle{animation:none;stroke-dashoffset:0}
  .slip{transition:none}
}
@media print{
  body{background:#fff;color:#000}
  .examhead,.topbar,.no-print,.filter,.submitbar{display:none!important}
  .sheet{border:0;box-shadow:none;margin:0;padding:0}
  .stamp{opacity:.9;animation:none}
  .q{break-inside:avoid}
}
</style>
</head>
<body>
<main id="app"></main>

<script src="./config.js"></script>
<script>
window.ARC_UNITS=[{"id":"u1","no":"Ⅰ","code":"9과01","area":"과학과 사회","title":"과학과 인류의 지속가능한 삶","sets":[[{"q":"과학 지식의 특징으로 옳은 것은?","o":["새로운 증거가 나오면 수정될 수 있다.","사회와 기술의 발달과는 관련이 없다.","실험이나 관찰 없이 상상만으로 만들어진다.","유명한 과학자 한 사람의 의견으로 결정된다.","한 번 확립되면 절대 바뀌지 않는다."],"a":1,"e":"과학 지식은 잠정적이어서 새로운 증거가 나오면 수정되거나 보완된다."},{"q":"과학적 탐구 과정에서 '가설 설정' 바로 다음에 오는 단계는?","o":["자료 수집 전 관찰","일반화","탐구 설계 및 수행","결론 도출","문제 인식"],"a":3,"e":"문제 인식 → 가설 설정 → 탐구 설계 및 수행 → 자료 해석 → 결론 도출 순서로 진행된다."},{"q":"과학적 탐구에서 '가설'의 의미로 옳은 것은?","o":["실험을 통해 확정된 결론","실험에서 측정한 값","실험에 사용하는 도구 목록","탐구 문제에 대한 잠정적인 답","결과를 정리한 그래프"],"a":4,"e":"가설은 탐구 문제에 대해 미리 세워 보는 잠정적인 답이다."},{"q":"실험에서 '변인 통제'를 하는 까닭으로 옳은 것은?","o":["여러 변인을 한꺼번에 바꾸어 보기 위해","측정값을 크게 만들기 위해","실험 시간을 줄이기 위해","결론을 미리 정해 두기 위해","조작 변인 외의 조건을 같게 하여 조작 변인의 영향만 알아보기 위해"],"a":5,"e":"변인 통제는 조작 변인 이외의 조건을 일정하게 유지하는 것이다."},{"q":"'빛의 세기에 따라 콩나물이 자라는 길이가 달라지는가?'를 알아보는 실험에서 조작 변인은?","o":["주는 물의 양","콩나물의 길이","빛의 세기","화분의 크기","실내 온도"],"a":3,"e":"실험자가 의도적으로 다르게 하는 조건인 빛의 세기가 조작 변인이다."},{"q":"5번 문항과 같은 콩나물 실험에서 종속 변인은?","o":["주는 물의 양","관찰 기간","빛의 세기","실내 온도","콩나물이 자란 길이"],"a":5,"e":"조작 변인에 따라 달라지는 결과인 콩나물의 길이가 종속 변인이다."},{"q":"과학 기술이 인류 문명의 발달에 기여한 사례가 아닌 것은?","o":["백신 개발로 감염병 환자가 줄었다.","별자리로 개인의 운명을 점치는 방법이 퍼졌다.","비료 합성으로 식량 생산량이 늘었다.","인쇄술의 발달로 지식이 널리 퍼졌다.","전기 이용으로 생활이 편리해졌다."],"a":2,"e":"점성술은 과학적 근거가 없는 활동이다."},{"q":"지속가능한 발전의 의미로 가장 알맞은 것은?","o":["미래 세대의 필요를 해치지 않으면서 현재 세대의 필요를 충족하는 발전","자연을 전혀 이용하지 않는 발전","현재 세대의 편리함을 가장 먼저 생각하는 발전","자원을 최대한 빨리 사용하는 발전","경제 성장만을 목표로 하는 발전"],"a":1,"e":"지속가능한 발전은 현재와 미래 세대가 함께 누릴 수 있는 발전이다."},{"q":"지속가능한 삶을 위한 실천으로 옳지 않은 것은?","o":["분리배출을 생활화한다.","장바구니와 텀블러를 사용한다.","가까운 거리는 걸어서 이동한다.","일회용품 사용을 늘린다.","사용하지 않는 전기 플러그를 뽑는다."],"a":4,"e":"일회용품 사용을 늘리면 자원 낭비와 쓰레기가 증가한다."},{"q":"대기 중 온실가스가 증가하여 나타나는 현상으로 가장 알맞은 것은?","o":["지구 평균 기온 상승","오존층의 두께 증가","빙하 면적 증가","계절의 사라짐","해수면 하강"],"a":1,"e":"온실가스가 늘면 지구 복사 에너지가 더 많이 흡수되어 평균 기온이 올라간다."},{"q":"과학 기술의 발달이 가져온 부정적인 영향의 예로 가장 알맞은 것은?","o":["일기 예보가 정확해졌다.","의료 영상 장비로 질병을 일찍 발견한다.","항생제 개발로 세균 감염 치료가 쉬워졌다.","플라스틱 쓰레기로 해양 생태계가 오염되었다.","인터넷으로 정보를 빠르게 얻게 되었다."],"a":4,"e":"플라스틱은 편리하지만 잘 분해되지 않아 해양 오염을 일으킨다."},{"q":"과학의 발달에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?","b":["ㄱ. 관찰 도구의 발달이 새로운 발견을 이끌기도 한다.","ㄴ. 과학과 기술은 서로 영향을 주고받으며 발달한다.","ㄷ. 과학 지식은 증거 없이 사회적 합의만으로 결정된다."],"o":"B","a":2,"e":"과학 지식은 증거를 바탕으로 만들어지므로 ㄷ은 옳지 않다."},{"q":"현미경의 발명이 과학 발달에 끼친 영향으로 가장 알맞은 것은?","o":["지구의 둘레를 측정하였다.","행성의 공전 궤도를 밝혔다.","원자를 직접 눈으로 보게 되었다.","전기를 발견하였다.","세포를 발견하고 생물의 구조를 연구하게 되었다."],"a":5,"e":"현미경으로 코르크 조각을 관찰하며 세포가 발견되었다."},{"q":"실험에서 대조군을 두는 목적으로 옳은 것은?","o":["실험을 더 빨리 끝내기 위해","실험군과 비교하여 조작 변인의 효과를 확인하기 위해","가설을 세우지 않기 위해","실험 결과를 원하는 방향으로 바꾸기 위해","측정 도구를 아끼기 위해"],"a":2,"e":"대조군은 조작 변인을 처리하지 않은 비교 기준이다."},{"q":"실험 결과를 그래프로 나타내는 까닭으로 가장 알맞은 것은?","o":["실험 과정을 생략하기 위해","가설을 새로 세우지 않기 위해","변인 사이의 관계를 한눈에 알아보기 위해","측정값을 바꾸기 위해","결과를 숨기기 위해"],"a":3,"e":"그래프는 변인 사이의 관계와 경향성을 쉽게 보여 준다."},{"q":"과학 지식이 '잠정적'이라는 것의 의미를 설명하고, 그 예를 한 가지 쓰시오.","r":[[4,"새로운 증거나 발견에 따라 수정될 수 있음을 설명함","수정/바뀔/바뀐/변할/달라질/고쳐/바뀌"],[4,"알맞은 예를 제시함(천동설→지동설, 명왕성 분류 변경 등)","지동설/천동설|명왕성|원자모형/원자모|대륙이동/판구조|자연발생"]],"m":"과학 지식은 새로운 증거가 나오면 수정될 수 있다는 뜻이다. 예를 들어 지구가 우주의 중심이라는 천동설이 태양 중심의 지동설로 바뀌었다."},{"q":"'소금물의 농도에 따라 달걀이 뜨는 정도가 달라지는가?'를 알아보는 실험을 설계하려고 한다. 조작 변인과, 같게 유지해야 할 통제 변인 두 가지를 쓰시오.","r":[[4,"조작 변인으로 소금의 양(소금물의 농도)을 씀","소금의양/소금양/농도/소금의농도"],[2,"통제 변인을 한 가지 씀(물의 양, 물의 온도, 같은 달걀, 같은 용기 등)","물의양/물양|온도|달걀/계란|용기/그릇/비커/컵"],[2,"통제 변인을 두 가지 씀","물의양/물양|온도|달걀/계란|용기/그릇/비커/컵",2]],"m":"조작 변인은 소금의 양(농도)이다. 통제 변인은 물의 양, 물의 온도, 같은 달걀 사용 등이다."},{"q":"지구 온난화의 원인을 쓰고, 이를 줄이기 위해 개인이 실천할 수 있는 방법을 두 가지 쓰시오.","r":[[4,"화석 연료 사용 등으로 온실가스(이산화 탄소)가 증가함","온실/이산화탄소/탄소"],[2,"실천 방법을 한 가지 씀","대중교통/자전거/걷|전기&절약/전기를아/플러그/불을끄/전등|분리배출/재활용|일회용/텀블러/장바구니|나무/식물|고기/채식"],[2,"실천 방법을 두 가지 씀","대중교통/자전거/걷|전기&절약/전기를아/플러그/불을끄/전등|분리배출/재활용|일회용/텀블러/장바구니|나무/식물|고기/채식",2]],"m":"화석 연료를 태워 이산화 탄소 같은 온실가스가 늘어났기 때문이다. 대중교통 이용하기, 사용하지 않는 플러그 뽑기로 줄일 수 있다."},{"q":"과학 기술이 인류 문명에 기여한 사례 한 가지와, 그 기술이 일으킨 문제점 한 가지를 짝지어 쓰시오.","r":[[4,"과학 기술의 기여 사례를 씀","백신|항생제/페니실린|비료|전기|인터넷|플라스틱|자동차|컴퓨터|스마트폰|인쇄|농약"],[4,"그 기술로 생긴 문제점을 씀","오염|쓰레기|온난화|내성|중독|개인정보|미세먼지|환경|부작용"]],"m":"플라스틱은 가볍고 값싸 생활을 편리하게 했지만, 잘 분해되지 않아 해양 오염을 일으킨다."},{"q":"'식물은 빛이 있어야 잘 자랄까?'라는 탐구 문제에 대한 가설을 세우고, 이를 확인할 실험 방법을 쓰시오.","r":[[4,"가설을 '~하면 ~할 것이다' 형태로 씀","것이다/것이라"],[4,"빛이 있는 조건과 없는 조건을 비교하는 실험을 설계함","빛&어두/빛&없는/빛&차단/빛&가리/빛&상자/햇빛&그늘"]],"m":"가설: 빛을 받은 식물이 빛을 받지 못한 식물보다 더 잘 자랄 것이다. 방법: 같은 식물 두 개를 준비해 하나는 햇빛에, 하나는 어두운 상자 안에 두고 물과 온도는 같게 하여 자란 길이를 비교한다."}],[{"q":"다음은 물의 온도에 따라 각설탕이 모두 녹는 데 걸린 시간이다. 이 결과로 알 수 있는 사실은?","d":"| 물의 온도(℃) | 10 | 20 | 30 | 40 |\n| 녹는 데 걸린 시간(초) | 60 | 40 | 25 | 15 |","o":["설탕의 양이 많을수록 빨리 녹는다.","물의 양이 많을수록 빨리 녹는다.","물의 온도와 녹는 시간은 관계가 없다.","물의 온도가 높을수록 설탕이 빨리 녹는다.","물의 온도가 높을수록 설탕이 느리게 녹는다."],"a":4,"e":"온도가 10 ℃에서 40 ℃로 높아질수록 걸린 시간이 60초에서 15초로 줄었다."},{"q":"1번 자료의 실험에서 조작 변인은?","o":["녹는 데 걸린 시간","설탕의 양","물의 양","저어 주는 빠르기","물의 온도"],"a":5,"e":"실험자가 의도적으로 바꾼 조건은 물의 온도이다."},{"q":"1번 자료의 실험에서 종속 변인은?","o":["녹는 데 걸린 시간","컵의 재질","각설탕의 개수","물의 온도","실험한 날짜"],"a":1,"e":"물의 온도에 따라 달라진 결과는 녹는 데 걸린 시간이다."},{"q":"1번 자료의 실험에서 통제 변인이 아닌 것은?","o":["각설탕의 크기","저어 주는 빠르기","물의 온도","컵의 모양","물의 양"],"a":3,"e":"물의 온도는 조작 변인이다."},{"q":"다음은 어느 관측소에서 측정한 대기 중 이산화 탄소 농도이다. 이에 대한 해석으로 옳은 것은?","d":"| 연도 | 1960 | 1990 | 2020 |\n| 이산화 탄소 농도(ppm) | 317 | 354 | 413 |","o":["이산화 탄소 농도가 점점 감소하였다.","이산화 탄소 농도가 계속 증가하였다.","이산화 탄소 농도가 일정하게 유지되었다.","1990년 이후 농도가 감소하였다.","자료로는 농도 변화를 알 수 없다."],"a":2,"e":"317 → 354 → 413 ppm으로 계속 증가하였다."},{"q":"5번 자료에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?","b":["ㄱ. 1960년보다 2020년의 이산화 탄소 농도가 높다.","ㄴ. 30년마다 증가한 양이 같다.","ㄷ. 화석 연료 사용량 증가가 원인 중 하나라고 추론할 수 있다."],"o":"B","a":3,"e":"1960~1990년에 37 ppm, 1990~2020년에 59 ppm 증가하여 증가량이 다르다."},{"q":"다음은 한 모둠의 실험 보고서 일부이다. 이 보고서의 가장 큰 문제점은?","d":"탐구 문제: 소금이 물의 어는 시간에 영향을 줄까?\n실험: 소금물과 맹물을 냉동실에 넣고 한 번 측정하였다.\n결론: 소금물은 항상 늦게 언다.","o":["한 번만 측정하여 결과를 일반화하였다.","결과를 표로 나타내었다.","조작 변인을 정하지 않았다.","가설을 세우지 않았다.","냉동실을 사용하였다."],"a":1,"e":"한 번의 결과로 '항상'이라고 일반화하면 신뢰도가 낮다. 반복 실험이 필요하다."},{"q":"다음은 우주관의 변화를 나타낸 것이다. 이 사례가 보여 주는 과학의 특징으로 알맞은 것은?","d":"천동설: 지구가 우주의 중심에 있고 천체가 지구 주위를 돈다.\n        ↓ (망원경 관측 증거 축적)\n지동설: 지구는 태양 주위를 도는 행성 중 하나이다.","o":["과학 지식은 변하지 않는다.","과학 지식은 다수결로 정해진다.","과학 지식은 관측 도구와 관계없다.","과학 지식은 새로운 증거에 따라 수정된다.","과학 지식은 한 사람이 만든다."],"a":4,"e":"새로운 관측 증거가 쌓이며 기존 이론이 수정되었다."},{"q":"다음 실험에서 확인하려는 것은?","d":"| 구분 | 씨앗 A | 씨앗 B |\n| 물 | 준다 | 주지 않는다 |\n| 온도 | 25 ℃ | 25 ℃ |\n| 빛 | 있음 | 있음 |","o":["씨앗의 종류에 따른 차이","빛이 발아에 미치는 영향","흙의 종류에 따른 차이","온도가 발아에 미치는 영향","물이 발아에 미치는 영향"],"a":5,"e":"두 씨앗은 물의 조건만 다르므로 물의 영향을 알아보는 실험이다."},{"q":"다음은 10 km를 이동할 때 1인당 이산화 탄소 배출량(가상 자료)이다. 탄소 배출을 가장 줄일 수 있는 이동 방법은?","d":"| 이동 방법 | 승용차(1명) | 버스 | 지하철 | 자전거 |\n| 배출량(kg) | 2.1 | 0.8 | 0.4 | 0 |","o":["승용차","버스","자전거","승용차와 버스를 번갈아 이용","지하철"],"a":3,"e":"자전거는 이동 중 이산화 탄소를 배출하지 않는다."},{"q":"다음은 어느 나라의 홍역 백신 도입 전후 환자 수 변화를 나타낸 것이다. 이에 대한 해석으로 가장 알맞은 것은?","d":"백신 도입 전: 연간 약 50만 명\n백신 도입 10년 후: 연간 약 2만 명","o":["백신 도입 후 환자 수가 늘었다.","백신은 환자 수에 영향을 주지 않았다.","환자 수는 백신보다 날씨의 영향을 받았다.","백신 도입 후 환자 수가 크게 줄었다.","자료만으로는 환자 수의 증감을 알 수 없다."],"a":4,"e":"백신 도입 후 환자 수가 약 50만 명에서 2만 명으로 줄었다."},{"q":"다음 탐구에서 결론으로 가장 알맞은 것은?","d":"가설: 빛이 강할수록 검정말에서 발생하는 기포 수가 많을 것이다.\n| 전등과의 거리(cm) | 10 | 20 | 30 |\n| 1분 동안 기포 수(개) | 28 | 15 | 7 |","o":["전등과의 거리와 기포 수는 관계없다.","빛이 강할수록 기포 수가 많아져 가설이 지지된다.","기포 수는 물의 양에만 영향을 받는다.","가설이 틀렸다.","전등과 멀수록 광합성이 활발하다."],"a":2,"e":"전등이 가까울수록(빛이 강할수록) 기포 수가 많아 가설을 지지한다."},{"q":"실험 결과가 가설과 다르게 나왔을 때 가장 올바른 태도는?","o":["실험을 그만둔다.","가설에 맞게 결과를 고쳐 적는다.","다른 모둠의 결과를 베껴 쓴다.","결과를 버리고 보고서에서 뺀다.","결과를 그대로 기록하고 가설을 수정하여 다시 탐구한다."],"a":5,"e":"결과는 정직하게 기록하고, 필요하면 가설을 수정해 다시 탐구한다."},{"q":"과학 탐구를 할 때 지켜야 할 태도로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?","b":["ㄱ. 측정값을 정직하게 기록한다.","ㄴ. 다른 사람의 자료를 사용할 때는 출처를 밝힌다.","ㄷ. 원하는 결과가 나올 때까지 측정값을 골라 쓴다."],"o":"B","a":2,"e":"원하는 값만 골라 쓰는 것은 결과를 조작하는 행위이다."},{"q":"다음은 두 에너지원의 특징이다. (가), (나)의 공통점으로 알맞은 것은?","d":"(가) 태양광 발전: 햇빛으로 전기를 만든다.\n(나) 풍력 발전: 바람으로 발전기를 돌린다.","o":["발전 과정에서 온실가스 배출이 적고 자원이 고갈되지 않는다.","날씨와 관계없이 일정하게 발전한다.","자원이 곧 고갈된다.","발전 과정에서 온실가스를 많이 배출한다.","석탄을 연료로 사용한다."],"a":1,"e":"태양광과 풍력은 대표적인 신재생 에너지이다."},{"q":"1번 자료(물의 온도와 설탕이 녹는 시간)로부터 내릴 수 있는 결론을 쓰고, 그 근거를 자료의 수치를 이용하여 쓰시오.","r":[[4,"물의 온도가 높을수록 설탕이 빨리 녹는다는 결론을 씀","높을수록&빨리/높을수록&짧/높아질수록&빨리/높아질수록&짧/올라갈수록&빨리/높으면&빨리"],[4,"수치 변화(60초→15초 등)를 근거로 제시함","60&15/60초/15초/줄어/감소/짧아"]],"m":"물의 온도가 높을수록 설탕이 빨리 녹는다. 10 ℃에서 60초 걸리던 것이 40 ℃에서는 15초로 줄었기 때문이다."},{"q":"7번 보고서처럼 실험을 한 번만 하여 결론을 내렸을 때의 문제점과 개선 방법을 쓰시오.","r":[[4,"한 번의 결과는 우연이나 오차일 수 있어 믿기 어려움을 씀","오차/우연/신뢰/믿기"],[4,"여러 번 반복 측정하여 평균을 구하는 방법을 씀","여러번/반복/평균/세번/3회"]],"m":"한 번의 결과는 우연이나 측정 오차일 수 있어 신뢰도가 낮다. 같은 조건으로 여러 번 반복 측정하고 평균을 구해야 한다."},{"q":"5번 자료처럼 대기 중 이산화 탄소 농도가 증가한 원인과, 그로 인해 나타나는 환경 변화를 한 가지씩 쓰시오.","r":[[4,"원인: 화석 연료 사용, 숲 파괴 등","화석/석탄/석유/연료|숲/삼림/벌목|공장/자동차"],[4,"영향: 지구 기온 상승, 해수면 상승, 이상 기후 등","기온/온난화|해수면|빙하|이상기후/폭염/가뭄/홍수"]],"m":"석탄, 석유 같은 화석 연료를 많이 태웠기 때문이다. 그 결과 지구 평균 기온이 올라가고 해수면이 상승한다."},{"q":"실험 결과가 가설과 맞지 않을 때 과학자가 가져야 할 태도를 두 가지 측면에서 쓰시오.","r":[[4,"결과를 조작하지 않고 정직하게 기록함","조작하지/그대로/정직/인정/사실대로"],[4,"가설을 수정하거나 다시 탐구함","수정/다시/재실험/새로운가설/새가설"]],"m":"결과를 바꾸지 않고 있는 그대로 기록해야 한다. 그리고 가설을 수정하여 다시 탐구해야 한다."},{"q":"15번 자료의 신재생 에너지 사용을 늘려야 하는 까닭을 두 가지 쓰시오.","r":[[4,"온실가스나 환경 오염 물질 배출이 적음","온실/이산화탄소/오염/탄소"],[4,"자원이 고갈되지 않고 계속 쓸 수 있음","고갈/무한/재생/계속/바닥나지"]],"m":"발전할 때 온실가스 배출이 적어 지구 온난화를 줄일 수 있고, 햇빛과 바람은 고갈되지 않기 때문이다."}],[{"q":"국제 사회가 2015년에 채택한 '지속가능발전목표(SDGs)'를 정한 기구는?","o":["국제연합(UN)","세계무역기구 단독","국제축구연맹","세계보건기구 단독","국제올림픽위원회"],"a":1,"e":"지속가능발전목표는 국제연합에서 채택한 17개 목표이다."},{"q":"'적정 기술'의 의미로 가장 알맞은 것은?","o":["가장 비싸고 복잡한 첨단 기술","군사용으로만 쓰는 기술","그 지역의 환경과 경제적 여건에 맞게 만든 기술","대기업만 사용할 수 있는 기술","전기가 반드시 필요한 기술"],"a":3,"e":"적정 기술은 현지 사람들이 쉽게 쓰고 유지할 수 있도록 만든 기술이다."},{"q":"적정 기술의 예로 가장 알맞은 것은?","o":["자율 주행 자동차","대형 원자력 발전소","우주 정거장","굴려서 많은 물을 쉽게 옮기는 둥근 물통","초고속 인터넷망"],"a":4,"e":"물을 굴려서 운반하는 물통은 물을 긷는 수고를 줄이는 대표적 적정 기술이다."},{"q":"인공지능 기술의 활용이 늘면서 함께 고민해야 할 문제로 가장 알맞은 것은?","o":["모든 일자리가 즉시 사라지는 문제","개인정보 유출과 판단의 편향 문제","전기가 필요 없어지는 문제","계산 속도가 느려지는 문제","과학 지식이 더 이상 필요 없어지는 문제"],"a":2,"e":"인공지능은 많은 데이터를 쓰므로 개인정보 보호와 편향 문제를 고려해야 한다."},{"q":"다음은 민수의 탐구 과정이다. 「 」 안의 활동은 탐구의 어느 단계인가?","d":"민수는 '온도가 높으면 빵 곰팡이가 잘 자랄 것이다'라고 생각하였다.\n그래서 「빵 두 조각을 준비해 하나는 냉장고, 하나는 실온에 두고 5일 동안 관찰하기로 하였다.」","o":["문제 인식","일반화","결론 도출","가설 설정","탐구 설계"],"a":5,"e":"조건을 정하고 관찰 방법을 계획하는 것은 탐구 설계 단계이다."},{"q":"과학적 탐구 문제로 적절하지 않은 것은?","o":["빛의 색에 따라 식물이 자라는 정도가 다를까?","물의 온도에 따라 소금이 녹는 양은 달라질까?","경사면의 기울기에 따라 공이 굴러가는 거리가 달라질까?","운동 후 맥박 수는 얼마나 변할까?","가장 아름다운 꽃은 무엇일까?"],"a":5,"e":"아름다움은 사람마다 다른 가치 판단이라 실험으로 확인하기 어렵다."},{"q":"화분을 관찰한 내용 중 '관찰'에 해당하는 것은?","o":["흙에 영양분이 없을 것이다.","햇빛이 너무 강했을 것이다.","곧 식물이 죽을 것이다.","잎 끝이 노란색으로 변했다.","물이 부족해서 잎이 시든 것 같다."],"a":4,"e":"감각으로 직접 확인한 사실이 관찰이고, 나머지는 원인을 짐작한 추론이다."},{"q":"다음 중 정량적 관찰에 해당하는 것은?","o":["꽃이 붉은색이다.","돌이 무거워 보인다.","물의 온도는 25 ℃이다.","공기가 상쾌하다.","물이 따뜻하다."],"a":3,"e":"수치와 단위로 나타낸 관찰이 정량적 관찰이다."},{"q":"유전자 변형 작물처럼 과학 기술과 관련된 사회적 쟁점에 대해 의사 결정을 할 때 바람직한 태도는?","o":["쟁점에 관심을 두지 않는다.","과학적 근거를 확인하고 다양한 관점을 함께 고려한다.","자신과 같은 의견만 찾아본다.","처음 들은 정보만 믿는다.","유명인의 의견을 그대로 따른다."],"a":2,"e":"근거에 바탕을 두고 여러 입장을 비교하여 판단해야 한다."},{"q":"자원 순환을 위한 행동 중 '재사용'에 해당하는 것은?","o":["유리병을 씻어서 다시 음료를 담는다.","우유 팩을 분리배출한다.","플라스틱을 녹여 새 제품을 만든다.","폐지를 모아 재생지를 만든다.","음식물 쓰레기를 퇴비로 만든다."],"a":1,"e":"물건을 형태 그대로 다시 쓰는 것이 재사용이다."},{"q":"'탄소 중립'의 의미로 가장 알맞은 것은?","o":["탄소가 들어 있는 물질을 쓰지 않는 것","숲을 모두 없애는 것","배출한 온실가스만큼 흡수하거나 줄여 실질 배출량을 0으로 만드는 것","화석 연료 사용을 두 배로 늘리는 것","이산화 탄소를 전혀 배출하지 않는 것"],"a":3,"e":"배출량과 흡수·제거량이 같아 순배출량이 0인 상태이다."},{"q":"다음은 지우의 실험이다. 실험 설계에서 잘못된 점은?","d":"탐구 문제: 물의 온도에 따라 설탕이 녹는 빠르기가 다를까?\n컵 A: 20 ℃ 물 100 mL, 설탕 5 g\n컵 B: 60 ℃ 물 200 mL, 설탕 5 g","o":["물의 양을 같게 하지 않았다.","설탕을 사용하였다.","물의 온도를 다르게 하였다.","설탕의 양이 다르다.","컵을 두 개 사용하였다."],"a":1,"e":"조작 변인(온도) 외에 물의 양도 달라 변인 통제가 되지 않았다."},{"q":"파스퇴르는 목이 S자로 굽은 플라스크에 끓인 고기즙을 넣어 두었더니 오랫동안 미생물이 생기지 않았다. 이 실험의 결론으로 알맞은 것은?","o":["생물은 무생물에서 저절로 생긴다.","공기가 없어야 미생물이 생긴다.","고기즙은 끓여도 상하지 않는다.","미생물은 공기 중의 미생물로부터 생긴다.","플라스크 모양은 결과와 관계없다."],"a":4,"e":"굽은 목에 먼지와 미생물이 걸려 들어가지 못해 자연발생설이 부정되었다."},{"q":"전기 자동차 보급을 늘릴 때 온실가스 감축 효과를 높이기 위해 함께 고려해야 할 점으로 가장 알맞은 것은?","o":["자동차의 색깔","충전에 쓰는 전기를 어떤 방식으로 생산하는지","운전자의 나이","자동차 바퀴의 개수","라디오 기능"],"a":2,"e":"전기를 화석 연료로 만들면 발전 과정에서 온실가스가 나온다."},{"q":"과학 관련 인터넷 기사가 믿을 만한지 판단하는 방법으로 가장 알맞은 것은?","o":["친구가 공유했으면 믿는다.","조회 수가 많으면 믿는다.","제목이 자극적이면 믿는다.","글이 길면 믿는다.","출처와 근거 자료, 전문가 검토 여부를 확인한다."],"a":5,"e":"출처와 근거를 확인하는 것이 과학적 정보 판단의 기본이다."},{"q":"적정 기술의 의미를 쓰고, 적정 기술이 필요한 까닭을 쓰시오.","r":[[4,"지역의 환경, 경제 수준에 맞는 기술이라는 의미를 씀","지역/현지/환경에맞/수준에맞/여건/형편"],[4,"비싼 첨단 기술을 쓰기 어려운 곳에서 삶의 질을 높이기 위함을 씀","비용/저렴/값싸/비싼/전기가없/유지/삶의질/생활&개선/어려운"]],"m":"적정 기술은 그 지역의 환경과 경제적 여건에 맞게 만든 기술이다. 전기나 돈이 부족해 첨단 기술을 쓰기 어려운 지역 사람들의 생활을 개선할 수 있기 때문이다."},{"q":"잎 끝이 노랗게 변한 화분을 보았다. 이 상황에서 할 수 있는 '관찰' 한 가지와 '추론' 한 가지를 각각 쓰시오.","r":[[4,"관찰: 감각으로 확인한 사실(잎이 노랗다, 흙이 말라 있다 등)","노랗/노란/시들/말라/마른/색"],[4,"추론: 관찰을 바탕으로 원인을 짐작함(물, 햇빛, 영양 부족 등)","부족/때문/것이다/것같/짐작"]],"m":"관찰: 잎 끝이 노랗고 흙이 말라 있다. 추론: 물이 부족해서 잎이 노랗게 변했을 것이다."},{"q":"탄소 중립의 의미를 쓰고, 탄소 중립을 이루기 위한 방법을 한 가지 쓰시오.","r":[[4,"온실가스 배출량과 흡수량이 같아 순배출이 0이 됨을 씀","배출&흡수/0/제로/영"],[4,"방법: 신재생 에너지, 나무 심기, 에너지 절약 등","신재생/태양광/풍력|나무/숲|절약/대중교통/아껴|전기차"]],"m":"배출하는 온실가스만큼 흡수하거나 줄여 실질 배출량을 0으로 만드는 것이다. 화석 연료 대신 태양광 같은 신재생 에너지를 사용한다."},{"q":"유전자 변형 작물 재배에 대해 찬성하는 근거와 반대하는 근거를 한 가지씩 쓰시오.","r":[[4,"찬성 근거: 식량 생산 증가, 병충해에 강함 등","생산/식량/수확|병충해/해충/병에강|영양|가뭄"],[4,"반대 근거: 안전성 불확실, 생태계 영향 등","안전/부작용|생태계/다른생물|알레르기|독성|유전자&퍼"]],"m":"찬성: 병충해에 강한 작물을 만들어 식량 생산량을 늘릴 수 있다. 반대: 사람 몸과 생태계에 미치는 장기적인 영향이 아직 충분히 밝혀지지 않았다."},{"q":"13번의 파스퇴르 실험에서 S자로 굽은 목이 한 역할과, 이 실험으로 알게 된 사실을 쓰시오.","r":[[4,"굽은 목에 먼지와 미생물이 걸려 고기즙에 들어가지 못함","걸려/막/들어가지/차단/굽은"],[4,"생물은 생물로부터 생긴다(자연발생설이 틀림)","자연발생/생물로부터/생물에서/미생물이들어"]],"m":"공기는 통하지만 먼지와 미생물은 굽은 목에 걸려 들어가지 못한다. 따라서 미생물은 저절로 생기지 않고 다른 미생물로부터 생긴다는 것을 알게 되었다."}]]},{"id":"u2","no":"Ⅱ","code":"9과02","area":"생명","title":"생물의 구성과 다양성","sets":[[{"q":"생물을 구성하는 기본 단위는?","o":["세포","조직","기관","기관계","개체"],"a":1,"e":"모든 생물은 세포로 이루어져 있으며 세포가 생명 활동의 기본 단위이다."},{"q":"식물 세포에는 있지만 동물 세포에는 없는 구조는?","o":["핵","마이토콘드리아","세포질","엽록체","세포막"],"a":4,"e":"엽록체와 세포벽은 식물 세포에만 있다."},{"q":"핵의 기능으로 옳은 것은?","o":["에너지를 만든다.","물질의 출입을 조절한다.","유전 물질이 있어 세포의 생명 활동을 조절한다.","세포의 모양을 단단하게 유지한다.","광합성을 한다."],"a":3,"e":"핵에는 유전 물질이 있어 생 ───┘","o":["A 쪽으로 휜다.","휘지 않고 길어지기만 한다.","짧아진다.","B 쪽으로 휜다.","A와 B가 떨어진다."],"a":4,"e":"A가 더 많이 늘어나므로 덜 늘어나는 B 쪽으로 휜다."},{"q":"프랑스의 에펠탑은 여름에 겨울보다 높이가 약 15 cm 높아진다고 한다. 이 현상과 관계 깊은 것은?","o":["복사","비열","열평형","열팽창","단열"],"a":4,"e":"철탑이 온도에 따라 열팽창한다."},{"q":"겨울에 열화상 카메라로 집을 찍었더니 창틀 주변이 붉게(온도가 높게) 나타났다. 이에 대한 해석으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?","b":["ㄱ. 창틀 주변으로 실내의 열이 빠져나가고 있다.","ㄴ. 창틀 주변의 단열이 잘 되어 있지 않다.","ㄷ. 단열재를 보강하면 난방 에너지를 줄일 수 있다."],"o":"B","a":5,"e":"열이 새는 곳을 보강하면 에너지를 절약할 수 있다."},{"q":"이중창은 유리 사이에 공기층이 있다. 이 공기층이 단열 효과를 내는 까닭은?","o":["공기는 비열이 0이기 때문","공기가 유리를 두껍게 하기 때문","공기가 열을 만들어 내기 때문","공기가 빛을 막기 때문","공기는 열을 잘 전도하지 않기 때문"],"a":5,"e":"갇힌 공기는 열의 전도가 잘 일어나지 않는다."},{"q":"비커의 물에 톱밥을 넣고 한쪽 아래를 가열하였더니 톱밥이 원을 그리며 움직였다. 이 실험으로 알 수 있는 열의 이동 방식은?","o":["전도","복사","대류","단열","열팽창"],"a":3,"e":"데워진 물이 위로 올라가고 찬 물이 내려오는 대류가 일어난다."},{"q":"같은 햇빛 아래 검은색 캔과 흰색 캔에 같은 양의 물을 넣고 온도를 측정하였다. 결과와 해석으로 옳은 것은?","d":"| 시간(분) | 0 | 10 | 20 |\n| 검은색 캔(℃) | 20 | 29 | 36 |\n| 흰색 캔(℃) | 20 | 23 | 26 |","o":["검은색 캔이 복사열을 더 많이 흡수한다.","흰색 캔이 복사열을 더 많이 흡수한다.","두 캔은 복사열을 같게 흡수한다.","검은색 캔은 대류만 일어난다.","캔의 색은 온도에 영향을 주지 않는다."],"a":1,"e":"검은색은 복사 에너지를 잘 흡수한다."},{"q":"1번 자료에서 A와 B의 온도 변화를 열의 이동으로 설명하고, 열평형 온도를 쓰시오.","r":[[4,"A는 열을 잃고 B는 열을 얻음(A에서 B로 열이 이동)","잃&얻/a에서b/a→b/a가b에게/a가b로"],[4,"40 ℃에서 온도가 같아져 열평형이 됨","40"]],"m":"온도가 높은 A에서 낮은 B로 열이 이동하여 A는 온도가 내려가고 B는 온도가 올라간다. 40 ℃에서 두 물의 온도가 같아져 열평형 상태가 된다."},{"q":"4번 자료에서 비열이 큰 순서를 쓰고, 그렇게 판단한 근거를 쓰시오.","r":[[4,"A > B > C 순서를 씀","a>b>c/abc순/a,b,c순/a가가장크/a가제일크"],[4,"같은 열을 받았을 때 온도 변화가 작을수록 비열이 큼","온도변화가작/작을수록/적게변/온도가적게"]],"m":"A > B > C이다. 같은 질량에 같은 열을 가했을 때 온도 변화가 작을수록 비열이 크기 때문이다."},{"q":"10번 바이메탈이 가열될 때 휘는 원리를 설명하시오.","r":[[4,"두 금속의 열팽창 정도가 다름","팽창정도/팽창하는정도/열팽창&다르/늘어나는정도"],[4,"열팽창이 작은 금속(B) 쪽으로 휨","작은쪽/b쪽/b로/덜늘어나는쪽"]],"m":"두 금속은 열팽창 정도가 달라 가열하면 A가 B보다 더 많이 늘어난다. 그래서 바이메탈은 덜 늘어나는 B 쪽으로 휜다."},{"q":"8번 실험 결과를 이용하여 냄비의 바닥과 손잡이에 알맞은 재료를 각각 쓰고, 그 까닭을 쓰시오.","r":[[4,"바닥: 열전도가 빠른 금속(구리 등)","구리/알루미늄/금속"],[4,"손잡이: 열이 잘 전달되지 않는 나무, 플라스틱 등","나무/플라스틱/실리콘/고무/베이클라이트"]],"m":"바닥 },{"q":"얼음 주머니를 다친 부위에 대면 차갑게 느껴지는 까닭으로 가장 알맞은 것은?","o":["얼음이 응고하기 때문","얼음이 확산하기 때문","얼음이 열을 방출하기 때문","얼음이 융해하면서 주변의 열을 흡수하기 때문","얼음이 액화하기 때문"],"a":4,"e":"융해는 열을 흡수하는 상태 변화이다."},{"q":"1번 자료에서 구간 B와 D의 상태 변화 이름을 쓰고, 이 구간에서 온도가 일정한 까닭을 설명하시오.","r":[[4,"B는 융해, D는 기화","융해&기화"],[4,"가한 열이 상태 변화(입자 배열 변화)에 쓰임","상태변화/배열"]],"m":"B는 융해, D는 기화가 일어난다. 가해 준 열이 온도를 높이는 데 쓰이지 않고 입자의 배열을 바꾸는 상태 변화에 쓰이기 때문에 온도가 일정하다."},{"q":"양초가 녹을 때 부피는 늘어나지만 질량은 변하지 않는 까닭을 입자 모형으로 설명하시오.","r":[[4,"입자 사이 거리가 멀어져 부피가 커짐","거리/사이가멀/간격/배열"],[4,"입자의 수와 종류는 변하지 않아 질량이 일정함","질량&변하지/입자의수/입자수/개수"]],"m":"양초가 녹으면 입자 사이의 거리가 멀어져 부피가 커진다. 그러나 입자의 종류와 수는 변하지 않으므로 질량은 일정하다."},{"q":"겨울철 수도관이 터지는 까닭을 물의 상태 변화와 부피 변화로 설명하시오.","r":[[4,"물이 얼면(응고) 부피가 늘어남","부피&늘/부피&커/부피&증가"],[4,"늘어난 부피가 수도관을 밀어 터뜨림","밀/터/압력/깨/팽창"]],"m":"수도관 속의 물이 얼면 부피가 늘어난다. 늘어난 얼음이 수도관을 밀어내어 수도관이 터진다."},{"q":"9번 아이오딘 실험에서 일어난 두 가지 상태 변화를 순서대로 설명하시오.","r":[[4,"고체 아이오딘이 가열되어 기체로 승화함","승화"],[4,"기체가 차가운 윗부분에서 다시 고체가 됨","고체"]],"m":"가열된 고체 아이오딘이 액체를 거치지 않고 기체로 승화하였고, 그 기체가 차가운 윗부분에 닿아 다시 고체로 승화하였다."},{"q":"얼음 주머니로 다친 부위를 식힐 수 있는 까닭을 상태 변화와 열에너지로 설명하시오.","r":[[4,"얼음이 녹는(융해) 상태 변화","융해/녹"],[4,"이때 주변(피부)의 열을 흡수함","흡수/빼앗/가져"]],"m":"얼음이 녹는 융해가 일어나면서 피부 주변의 열을 흡수하므로 다친 부위의 온도가 내려간다."}],[{"q":"아이스크림을 포장할 때 드라이아이스를 넣는 까닭은?","o":["포장을 무겁게 하려고","아이스크림의 맛을 좋게 하려고","드라이아이스가 액화하기 때문","드라이아이스가 승화하며 주변의 열을 흡수하기 때문","드라이아이스가 열을 방출하기 때문"],"a":4,"e":"승화는 열을 흡수하는 상태 변화이다."},{"q":"이른 아침 풀잎에 이슬이 맺히는 상태 변화는?","o":["액화","승화","기화","응고","융해"],"a":1,"e":"밤새 차가워진 풀잎에 수증기가 닿아 액화한다."},{"q":"추운 겨울 아침 유리창 바깥쪽에 서리가 생기는 상태 변화는?","o":["기화","승화","융해","응고","액화"],"a":2,"e":"수증기가 곧바로 얼음 알갱이가 되는 승화이다."},{"q":"추운 날 따뜻한 실내에 들어오면 안경에 김이 서리는 상태 변화는?","o":["융해","기화","승화","응고","액화"],"a":5,"e":"실내 수증기가 차가운 안경알에 닿아 액화한다."},{"q":"운동을 하고 난 뒤 땀이 마르면서 시원해지는 까닭은?","o":["땀이 기화하면서 몸의 열을 흡수하기 때문","땀이 응고하기 때문","땀이 열을 방출하기 때문","땀이 액화하기 때문","땀이 몸 안으로 들어가기 때문"],"a":1,"e":"기화는 열을 흡수하는 상태 변화이다."},{"q":"추운 겨울 과일 창고에 물이 담긴 그릇을 두면 과일이 덜 어는 까닭은?","o":["물이 증발하며 열을 흡수하기 때문","물이 얼면서 열을 방출하기 때문","물이 과일을 덮어 주기 때문","물이 창고의 공기  되면 부피도 정확히 2배가 된다.","온도가 높아지면 부피가 일정하게 증가한다.","온도와 부피는 관계없다."],"a":4,"e":"같은 온도 간격마다 부피가 일정하게 늘어난다. 섭씨온도가 2배가 된다고 부피가 2배가 되지는 않는다."},{"q":"같은 벽돌을 스펀지 위에 다음과 같이 놓았다. 스펀지가 가장 깊이 눌리는 경우는?","d":"(가) 가장 넓은 면이 아래로 가게 놓음\n(나) 중간 넓이의 면이 아래로 가게 놓음\n(다) 가장 좁은 면이 아래로 가게 놓음","o":["(가)","(나)","(다)","모두 같다","알 수 없다"],"a":3,"e":"무게(힘)는 같고 면적이 가장 좁을 때 압력이 가장 크다."},{"q":"무게가 600 N인 사람이 두 발로 서 있다. 두 발이 바닥에 닿는 면적이 0.04 m²일 때 바닥이 받는 압력은?","o":["24 N/m²","1500 N/m²","6000 N/m²","15000 N/m²","24000 N/m²"],"a":4,"e":"600 N ÷ 0.04 m² = 15000 N/m²이다."},{"q":"7번의 사람이 한 발로 서면 바닥이 받는 압력은? (단, 한 발의 면적은 두 발 면적의 절반이다.)","o":["15000 N/m²","30000 N/m²","7500 N/m²","60000 N/m²","변하지 않는다"],"a":2,"e":"면적이 절반이 되면 압력은 2배가 된다."},{"q":"부풀린 풍선을 냉장고에 넣어 두었더니 크기가 작아졌다. 그 까닭은?","o":["풍선 속 기체 입자의 수가 줄어서","기체 입자의 크기가 커져서","냉장고의 압력이 높아서","풍선이 응고해서","온도가 낮아져 기체 입자의 운동이 둔해져서"],"a":5,"e":"온도가 낮아지면 기체의 부피가 줄어든다."},{"q":"다음은 같은 양의 기체가 두 용기에 들어 있는 모습을 설명한 것이다. 이에 대한 설명으로 옳은 것은? (단, 온도는 같다.)","d":"용기 A: 부피가 크고 입자 사이 거리가 멀다.\n용기 B: 부피가 작고 입자 사이 거리가 가깝다.","o":["B의 압력이 더 크다.","두 용기의 압력은 같다.","A의 입자 크기가 더 크다.","A의 압력이 더 크다.","B의 입자 수가 더 많다."],"a":1,"e":"부피가 작은 B에서 입자가 벽에 더 자주 충돌한다."},{"q":"잠수부가 내뿜은 공기 방울은 수면으로 올라갈수록 커진다. 그 까닭은?","o":["공기 방울이 응고하기 때문","물의 온도가 급격히 높아지기 때문","공기 방울 속 입자 수가 늘기 때문","위로 갈수록 물의 압력이 작아지기 때문","물이 공기 방울 안으로 들어가기 때문"],"a":4,"e":"수심이 얕아질수록 수압이 줄어 부피가 커진다."},{"q":"뜨거운 물을 부었다가 버린 빈 페트병의 뚜껑을 닫고 찬물을 부었더니 병이 찌그러졌다. 그 까닭으로 알맞은 것은?","o":["병이 열팽창했기 때문","병 속 기체의 온도가 높아졌기 때문","병 속 기체의 온도가 낮아져 부피가 줄었기 때문","병 속 기체의 입자 수가 늘었기 때문","찬물이 병 안으로 들어갔기 때문"],"a":3,"e":"온도가 낮아져 기체의 부피와 압력이 줄었다."},{"q":"한여름 뜨거운 도로를 오래 달린 자전거 타이어가 터지는 경우가 있다. 그 까닭은?","o":["도로의 마찰력이 줄기 때문","타이어가 응고하기 때문","기체 입자의 크기가 커지기 때문","타이어 속 기체의 입자 수가 줄기 때문","타이어 속 기체의 온도가 높아져 압력이 커지기 때문"],"a":5,"e":"온도가 높아지면 입자 운동이 활발해져 압력이 커진다."},{"q":"온도가 일정할 때 기체의 압력(가로축)과 부피(세로축)의 관계를 나타낸 그래프 모양으로 옳은 것은?","o":["압력이 커질수록 부피가 점점 작아지는 곡선(반비례)","원점을 지나는 직선","가로축과 나란한 직선","압력이 커질수록 부피가 커지는 곡선","세로축과 나란한 직선"],"a":1,"e":"부피는 압력에 반비례한다."},{"q":"압력이 일정할 때 기체의 온도(℃, 가로축)와 부피(세로축)의 관계를 나타낸 그래프로 옳은 것은?","o":["온도가 높아질수록 부피가 감소하는 직선","0 ℃에서 부피가 0인 직선","가로축과 나란한 직선","온도가 높아질수록 부피가 일정하게 증가하는 직선이며, 0 ℃에서 부피는 0이 아니다.","원점을 지나는 반비례 곡선"],"a":4,"e":"4번 자료처럼 0 ℃에서도 부피가 있고 온도에 따라 일정하게 증가한다."},{"q":"1번 자료에서 압력과 부피의 관계를 쓰고, 압력이 8기압일 때의 부피를 구하시오.","r":[[4,"압력과 부피는 반비례한다(곱이 일정)","반비례/일정/곱"],[4,"8기압일 때 5 mL","5ml/5밀리"]],"m":"압력과 부피의 곱이 40으로 일정하므로 압력과 부피는 반비례한다. 8기압이면 40 ÷ 8 = 5 mL이다."},{"q":"7번과 8번 상황에서 두 발로 설 때의 압력을 구하고, 한 발로 서면 압력이 어떻게 되는지 설명하시오.","r":[[4,"두 발일 때 15000 N/m²","15000"],[4,"한 발이면 면적이 절반이 되어 압력이 2배(30000 N/m²)","2배/두배/30000"]],"m":"600 N ÷ 0.04 m² = 15000 N/m²이다. 한 발로 서면 무게는 같고 면적이 절반이 되므로 압력은 2배인 30000 N/m²가 된다."},{"q":"잠수부가 내뿜은 공기 방울이 수면으로 올라갈수록 커지는 까닭을 쓰시오.","r":[[4,"위로 올라갈수록 물의 압력이 작아짐","압력&감소/압력&작/압력&줄/수압&낮/압력&낮"],[4,"공기 방울의 부피가 커짐(보일 법칙)","부피&커/부피&증가/부피&늘/보일"]],"m":"수면에 가까워질수록 공기 방울을 누르는 물의 압력이 작아진다. 온도가 크게 변하지 않을 때 압력이 작아지면 기체의 부피가 커진다."},{"q":"부풀린 풍선을 냉장고에 넣어 두면 작아지는 까닭을 입자의 운동으로 설명하시오.","r":[[4,"온도가 낮아져 입자 운동이 둔해짐","둔/느려/느리게/약해"],[4,"기체의 부피가 줄어듦(샤를 법칙)","부피&감소/부피&작/부피&줄/샤를"]],"m":"냉장고 안은 온도가 낮아 풍선 속 기체 입자의 운동이 둔해진다. 입자가 벽에 약하게, 덜 자주 충돌하므로 기체의 부피가 줄어든다."},{"q":"4번 자료로 90 ℃에서의 부피를 예상하고, 그렇게 예상한 근거를 쓰시오.","r":[[4,"약 133 mL","133"],[4,"30 ℃마다 11 mL씩 일정하게 증가함","11/일정"]],"m":"약 133 mL이다. 온도가 30 ℃ 높아질 때마다 부피가 11 mL씩 일정하게 늘어나기 때문이다."}],[{"q":"압정의 끝을 뾰족하게 만드는 까닭은?","o":["면적을 넓혀 압력을 작게 하려고","온도를 높이려고","부피를 늘리려고","면적을 좁혀 압력을 크게 하려고","무게를 줄이려고"],"a":4,"e":"같은 힘이라도 면적이 좁으면 압력이 커진다."},{"q":"압력을 작게 하기 위한 예로 가장 알맞은 것은?","o":["주삿바늘을 가늘게 만든다.","칼날을 날카롭게 간다.","못 끝을 뾰족하게 만든다.","송곳 끝을 가늘게 만든다.","스키의 바닥을 넓고 길게 만든다."],"a":5,"e":"넓은 스키는 눈에 닿는 면적을 넓혀 압력을 줄인다."},{"q":"비행기 안에서 과자 봉지가 부풀어 오르는 까닭은?","o":["기내의 압력이 지상보다 낮기 때문","기내 온도가 매우 낮기 때문","기내의 압력이 지상보다 높기 때문","봉지 속 기체 입자 수가 늘기 때문","과자가 팽창하기 때문"],"a":1,"e":"바깥 압력이 낮아지면 봉지 속 기체의 부피가 커진다."},{"q":"열기구 속 공기를 가열할 때 공기 입자의 변화로 옳은 것은?","o":["입자의 수가 늘어난다.","입자의 크기가 커진다.","입자 운동이 활발해져 부피가 팽창하려 한다.","입자 운동이 둔해진다.","입자가 서로 달라붙는다."],"a":3,"e":"온도가 높아지면 기체가 팽창하려 한다."},{"q":"추운 겨울 아침에 자동차 타이어 공기압이 낮아지는 까닭과 관계있는 것은?","o /반대"]],"m":"지구가 서쪽에서 동쪽으로 하루에 한 바퀴 자전하기 때문에, 지구에서 보면 별이 반대 방향인 동쪽에서 서쪽으로 도는 것처럼 보인다."},{"q":"월식이 일어나는 조건을 태양, 지구, 달의 배치와 달의 위상으로 설명하시오.","r":[[4,"태양 - 지구 - 달이 일직선으로 놓임","태양&지구&달/일직선"],[4,"달이 지구 그림자에 들어가며, 보름달(망)일 때 일어남","그림자|망/보름",2]],"m":"태양, 지구, 달 순서로 일직선에 놓일 때 달이 지구의 그림자 속으로 들어가 월식이 일어난다. 이때 달은 망(보름달)의 위치에 있다."},{"q":"흑점이 어둡게 보이는 까닭을 쓰고, 흑점을 며칠 동안 관찰하면 알 수 있는 사실을 쓰시오.","r":[[4,"흑점은 주변보다 온도가 낮음","온도&낮/온도&작/차가"],[4,"흑점이 이동하는 것으로 태양이 자전함을 알 수 있음","자전"]],"m":"흑점은 주변 광구보다 온도가 낮아서 어둡게 보인다. 흑점이 한쪽 방향으로 이동하는 것을 보고 태양이 자전한다는 것을 알 수 있다."},{"q":"태양 활동이 활발해질 때 지구에 나타날 수 있는 현상을 두 가지 쓰시오.","r":[[4,"현상을 한 가지 씀","오로라|통신/전파|자기폭풍/자기장|위성|정전/전력|gps/위치"],[4,"현상을 두 가지 씀","오로라|통신/전파|자기폭풍/자기장|위성|정전/전력|gps/위치",2]],"m":"오로라가 더 자주, 넓은 지역에서 나타난다. 무선 통신 장애나 인공위성 고장이 생길 수 있다."}],[{"q":"다음은 에라토스테네스의 측정 자료이다. 이 자료로 구한 지구의 둘레는?","d":"• 하짓날 정오, 시에네에서는 막대의 그림자가 생기지 않았다.\n• 같은 시각 알렉산드리아에서는 막대와 햇빛이 7.2°의 각을 이루었다.\n• 두 도시 사이의 거리는 925 km이다.","o":["약 6660 km","약 12800 km","약 40000 km","약 46250 km","약 92500 km"],"a":4,"e":"7.2° : 925 km = 360° : 둘레, 둘레 = 925 × 50 = 46250 km이다."},{"q":"1번 자료에서 알렉산드리아의 7.2°가 두 도시 사이의 중심각과 같은 까닭은?","o":["막대의 길이가 같기 때문","두 도시의 거리가 짧기 때문","햇빛이 평행하여 엇각이 같기 때문","태양이 가깝기 때문","지구가 평평하기 때문"],"a":3,"e":"평행선과 엇각의 성질을 이용하였다."},{"q":"1번 자료로 구한 값이 실제 지구 둘레(약 40000 km)와 차이가 나는 까닭으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?","b":["ㄱ. 실제 지구는 완전한 구형이 아니다.","ㄴ. 당시 두 도시 사이 거리의 측정이 정확하지 않았다.","ㄷ. 실제 햇빛은 지구에 거의 수직으로 모여 들어온다."],"o":"B","a":2,"e":"햇빛은 거의 평행하게 들어온다고 보는 것이 옳다."},{"q":"지름 1 cm인 동전을 눈에서 110 cm 떨어진 곳에 두었더니 달이 동전에 꼭 가려졌다. 달까지 거리가 384000 km일 때 달의 지름에 가장 가까운 값은?","o":["약 350 km","약 1750 km","약 3500 km","약 12700 km","약 42000 km"],"a":3,"e":"1 cm : 110 cm = 달의 지름 : 384000 km, 약 3490 km이다."},{"q":"북쪽 하늘을 향해 카메라를 고정하고 2시간 동안 노출하여 별의 궤적을 찍었다. 별의 궤적이 그리는 호의 중심각은?","o":["15°","20°","30°","45°","60°"],"a":3,"e":"1시간에 15°이므로 2시간이면 30°이다."},{"q":"5번 사진에서 별이 회전한 방향과 그 원인으로 옳은 것은?","o":["움직이지 않음","시계 반대 방향, 달의 공전","시계 방향, 지구 자전","시계 반대 방향, 지구 자전","시계 방향, 지구 공전"],"a":4,"e":"북쪽 하늘에서는 북극성을 중심으로 시계 반대 방향으로 돈다."},{"q":"매일 같은 시각에 남쪽 하늘을 관찰하면 별자리가 하루에 약 1°씩 서쪽으로 이동해 보인다. 그 원인은?","o":["지구의 공전","지구의 자전","별의 자전","태양의 자전","달의 공전"],"a":1,"e":"지구가 하루에 약 1°씩 공전하기 때문이다."},{"q":"지구의 공전 때문에 태양이 별자리 사이를 이동해 보이는 방향과 한 바퀴 도는 데 걸리는 시간으로 옳은 것은?","o":["서 → 동, 한 달","동 → 서, 1년","동 → 서, 하루","서 → 동, 하루","서 → 동, 1년"],"a":5,"e":"태양은 황도를 따라 서에서 동으로 1년에 한 바퀴 이동해 보인다."},{"q":"다음은 지구 주위를 도는 달의 위치를 나타낸 것이다. 월식이 일어날 수 있는 위치는?","d":"          태양 빛 →→→\n  위치 A: 태양과 지구 사이 (삭)\n  위치 B: 지구 기준 90° (상현)\n  위치 C: 지구를 사이에 두고 태양 반대편 (망)\n  위치 D: 지구 기준 270° (하현)","o":["C","A","B","D","어디서나 가능"],"a":1,"e":"월식은 달이 지구 그림자에 들어가는 망 위치에서 일어난다."},{"q":"해가 진 직후 서쪽 하늘에 가느다란 초승달이 보였다. 며칠 뒤 같은 시각 달의 모양과 위치 변화로 옳은 것은?","o":["하현달이 되어 서쪽에서 보인다.","보이지 않는다.","그믐달이 되어 동쪽에서 보인다.","상현달이 되어 남쪽 하늘 쪽에서 보인다.","모양과 위치가 변하지 않는다."],"a":4,"e":"초승달 → 상현달로 변하며 같은 시각 점점 동쪽(남쪽 하늘)으로 이동한다."},{"q":"다음 행성 자료에서 목성형 행성끼리 짝지은 것은?","d":"| 행성 | A | B | C | D |\n| 반지름(지구=1) | 11.2 | 0.53 | 9.4 | 0.38 |\n| 밀도(g/cm³) | 1.3 | 3.9 | 0.7 | 5.4 |\n| 고리 | 있음 | 없음 | 있음 | 없음 |","o":["A, B","A, C","B, D","C, D","B, C"],"a":2,"e":"반지름이 크고 밀도가 작으며 고리가 있는 A, C가 목성형이다."},{"q":"다음은 행성의 평균 밀도이다. 밀도가 가장 큰 행성은?","d":"| 행성 | 수성 | 금성 | 지구 | 화성 | 목성 | 토성 |\n| 밀도(g/cm³) | 5.4 | 5.2 | 5.5 | 3.9 | 1.3 | 0.7 |","o":["목성","금성","지구","수성","토성"],"a":3,"e":"지구의 밀도가 5.5 g/cm³로 가장 크다."},{"q":"태양의 흑점을 며칠 동안 같은 시각에 관찰하였더니 흑점의 위치가 한쪽 방향으로 조금씩 이동하였다. 이로부터 알 수 있는 사실은?","o":["달이 태양을 가린다.","지구가 공전한다.","태양의 크기가 변한다.","흑점이 태양 밖으로 날아간다.","태양이 자전한다."],"a":5,"e":"흑점의 이동은 태양의 자전을 보여 준다."},{"q":"다음은 연도별 흑점 수 변화를 요약한 것이다. 이에 대한 설명으로 옳은 것은?","d":"흑점 수는 약 11년을 주기로 많아졌다 적어지기를 반복한다.\n흑점 수가 많은 시기(극대기)와 적은 시기(극소기)가 있다.","o":["흑점 수와 태양 활동은 관계없다.","극대기에는 오로라가 자주 나타날 수 있다.","극대기에는 태양 활동이 약하다.","흑점 수는 늘 일정하다.","극소기에 플레어가 가장 많다."],"a":2,"e":"흑점 수가 많을수록 태양 활동이 활발하다."},{"q":"개기 일식 때 평소에는 잘 보이지 않던 코로나와 홍염을 관찰할 수 있는 까닭은?","o":["코로나가 개기 일식 때만 생기기 때문","지구의 그림자가 태양을 가리기 때문","달이 밝은 광구를 가려 주기 때문","태양이 가까워지기 때문","흑점이 사라지기 때문"],"a":3,"e":"광구가 너무 밝아 평소에는 대기가 보이지 않는다."},{"q":"1번 자료를 이용하여 지구 둘레를 구하는 비례식을 세우고, 지구 둘레를 구하시오.","r":[[4,"비례식(7.2° : 925 km = 360° : 둘레)을 세움","비례/360/7.2"],[4,"지구 둘레 46250 km","46250"]],"m":"7.2° : 925 km = 360° : 지구 둘레이다. 지구 둘레 = 925 × 360 ÷ 7.2 = 46250 km이다."},{"q":"4번 자료로 달의 지름을 구하는 방법(비례식)을 쓰고, 달의 지름을 구하시오.","r":[[4,"동전 지름 : 눈과 동전 거리 = 달 지름 : 달까지 거리(닮음비)","비례/닮음/110"],[4,"약 3500 km(3491 km)","3491/3490/3500/349"]],"m":"1 cm : 110 cm = 달의 지름 : 384000 km이다. 달의 지름 = 384000 ÷ 110 ≈ 3491 km(약 3500 km)이다."},{"q":"5번에서 별의 궤적이 그리는 호의 중심각을 구하고, 그렇게 구한 근거를 지구의 운동으로 설명하시오.","r":[[4,"중심각 30°","30"],[4,"지구가 1시간에 15°씩 자전함","15"]],"m":"30°이다. 지구는 24시간 동안 360° 자전하므로 1시간에 15°씩 자전하고, 2시간이면 30°가 된다."},{"q":"13번 관찰 결과로 알 수 있는 사실과 그 근거를 쓰시오.","r":[[4,"흑점이 일정한 방향으로 이동함","이동/움직/위치가변/위치가바뀌"],[4,"태양이 자전함","자전"]],"m":"흑점이 태양 표면에서 한쪽 방향으로 이동하므로 태양이 자전한다는 것을 알 수 있다."},{"q":"11번 자료의 A와 C가 목성형 행성인 까닭을 두 가지 특징으로 쓰시오.","r":[[4,"특징을 한 가지 씀(크기가 큼, 밀도가 작음, 고리가 있음 등)","반지름&크/크기&크/크다|밀도&작|고리|위성&많|기체"],[4,"특징을 두 가지 씀","반지름&크/크기&크/크다|밀도&작|고리|위성&많|기체",2]],"m":"A와 C는 반지름이 지구보다 매우 크고, 밀도가 작으며, 고리가 있다. 이는 목성형 행성의 특징이다."}],[{"q":"오늘 밤 9시에 남쪽 하늘 한가운데에 오리온자리가 보였다. 한 달 뒤 오리온자리가 같은 위치에 보이는 시각은?","o":["오후 11시 무렵","새벽 1시 무렵","오후 7시 무렵","보이지 않는다","오후 9시 무렵"],"a":3,"e":"별자리는 하루에 약 4분씩 일찍 떠서 한 달이면 약 2시간 일찍 같은 위치에 온다."},{"q":"일식을 관찰하는 방법으로 가장 안전한 것은?","o":["태양 관측용 필터가 달린 안경을 사용한다.","맨눈으로 태양을 오래 본다.","선글라스를 끼고 본다.","망원경으로 태양을 직접 본다.","검은 비닐봉지를 겹쳐 본다."],"a":1,"e":"강한 햇빛은 눈을 크게 다치게 할 수 있다."},{"q":"월식과 일식을 볼 수 있는 지역에 대한 설명으로 옳은 것은?","o":["월식은 한 도시에서만 볼 수 있다.","일식과 월식은 같은 지역에서만 볼 수 있다.","월식은 낮에만 볼 수 있다.","월식은 밤인 지역이면 어디서나 볼 수 있지만, 일식은 달의 그림자가 닿는 좁은 지역에서만 볼 수 있다.","일식은 지구 전체에서 동시에 볼 수 있다."],"a":4,"e":"달의 그림자는 지구보다 훨씬 작다."},{"q":"화성 탐사 로봇이 화성 표면을 돌아다니며 암석을 조사할 수 있는 까닭과 관계 깊은 화성의 특징은?","o":["화성은 목성형 행성이라 기체로 되어 있다.","화성은 고리가 있다.","화성은 태양보다 크다.","화성은 스스로 빛을 낸다.","화성은 지구형 행성이라 단단한 암석 표면이 있다."],"a":5,"e":"지구형 행성은 암석으로 이루어진 단단한 표면이 있다."},{"q":"물에 넣을 수 있다면 물에 뜰 정도로 평균 밀도가 작은 행성은?","o":["수성","금성","토성","지구","화성"],"a":3,"e":"토성의 평균 밀도는 약 0.7 g/cm³로 물보다 작다."},{"q":"행성을 지구형 행성과 목성형 행성으로 나누는 기준으로 알맞지 않은 것은?","o":["반지름","행성 이름의 글자 수","고리의 유무","질량","평균 밀도"],"a":2,"e":"물리적 특징을 기준으로 분류한다."},{"q":"최근 '우주 날씨 예보'를 하는 까닭으로 가장 알맞은 것은?","o":["별자리를 새로 만들기 위해","달의 모양을 예측하기 위해","행성의 개수를 세기 위해","지구의 비와 눈을 예보하기 위해","태양 활동으로 생기는 통신 장애, 위성 고장, 정전 등에 대비하기 위해"],"a":5,"e":"강한 태양 활동은 전파 통신과 전력망에 영향을 준다."},{"q":"새벽에 동쪽 하늘에서 볼 수 있는 달은?","o":["초승달","상현달","보름달","그믐달","달이 보이지 않는다"],"a":4,"e":"그믐달은 새벽에 동쪽 하늘에서 보인다."},{"q":"한밤중에 남쪽 하늘 높이 떠 있는 달은?","o":["보름달","그믐달","초승달","상현달","하현달"],"a":1,"e":"보름달은 해가 질 때 떠서 한밤중에 남쪽 하늘 가장 높이 있다."},{"q":"지구 자전의 증거가 되는 현상으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?","b":["ㄱ. 별의 일주 운동","ㄴ. 낮과 밤의 반복","ㄷ. 계절에 따라 밤하늘의 별자리가 달라짐"],"o":"B","a":2,"e":"계절별 별자리 변화는 지구 공전 때문이다."},{"q":"여름철 밤하늘과 겨울철 밤하늘에 보이는 별자리가 다른 까닭은?","o":["지구가 공전하기 때문","달이 공전하기 때문","태양이 자전하기 때문","별이 계절마다 이동하기 때문","지구가 자전하기 때문"],"a":1,"e":"지구가 공전하며 밤에 향하는 우주 방향이 바뀐다."},{"q":"개기 일식 때 태양 둘레에 진주색으로 넓게 퍼져 보이는 태양의 대기층은?","o":["광구","쌀알 무늬","플레어","흑점","코로나"],"a":5,"e":"코로나는 태양의 가장 바깥 대기층이다."},{"q":"흑점 부근에서 많은 에너지가 순간적으로 방출되며 폭발이 일어나는 현상은?","o":["코로나","쌀알 무늬","홍염","플레어","일식"],"a":4,"e":"플레어는 강한 에너지와 입자를 방출한다."},{"q":"학교 망원경으로 태양 흑점을 관찰할 때 흰 종이에 상을 비추어(투영하여) 관찰하는 까닭은?","o":["흑점이 종이에만 생기기 때문","태양을 직접 보면 눈이 크게 다칠 수 있기 때문","망원경을 아끼기 위해","태양을 식히기 위해","흑점을 크게 만들기 위해"],"a":2,"e":"직접 보지 않고 상을 비추어 안전하게 관찰한다."},{"q":"두 학교가 협력하여 에라토스테네스 방법으로 지구의 크기를 측정하려고 한다. 두 학교의 위치 조건으로 가장 알맞은 것은?","o":["높이가 같은 산 위에 있어야 한다.","바닷가에 있어야 한다.","같은 경도 위에 있어야 한다.","같은 도시에 있어야 한다.","같은 위도 위에 있어야 한다."],"a":3,"e":"같은 경도(남북 방향) 위에 있어야 두 지점과 지구 중심이 한 원 위에 놓인다."},{"q":"오늘 밤 9시에 남쪽 하늘에 보인 오리온자리가 한 달 뒤 같은 위치에 보이는 시각을 쓰고, 그 까닭을 지구의 운동으로 설명하시오.","r":[[4,"약 2시간 빠른 오후 7시 무렵","7시/2시간/두시간"],[4,"지구 공전으로 별자리가 하루에 약 1°씩 서쪽으로 이동해 보임","공전"]],"m":"오후 7시 무렵이다. 지구가 공전하여 같은 시각 별자리가 하루에 약 1°씩 서쪽으로 이동해 보이므로, 한 달 뒤에는 약 30°(2시간) 앞선 시각에 같은 위치에 온다."},{"q":"월식은 넓은 지역에서 볼 수 있지만 일식은 좁은 지역에서만 볼 수 있는 까닭을 설명하시오.","r":[[4,"월식은 달이 지구 그림자에 들어가므로 밤인 지역 어디서나 보임","밤&어디/밤인지역/밤이면/지구그림자/지구의그림자"],[4,"일식은 달의 그림자가 지구의 좁은 지역에만 드리워짐","달의그림자&좁/달그림자/좁은/일부"]],"m":"월식은 달 자체가 지구 그림자에 들어가므로 달이 보이는 밤인 지역이면 어디서나 볼 수 있다. 일식은 지구보다 작은 달의 그림자가 지구의 좁은 지역에만 드리워지므로 그 지역에서만 볼 수 있다."},{"q":"두 학교가 에라토스테네스 방법으로 지구 크기를 측정할 때 두 학교의 위치 조건과, 측정해야 할 값 두 가지를 쓰시오.","r":[[4,"두 학교가 같은 경도 위에 있어야 함","경도"],[4,"두 지점 사이의 거리와 중심각(그림자 각도 차이)을 측정","거리&각/거리&중심각/거리와각"]],"m":"두 학교는 같은 경도 위에 있어야 한다. 두 학교 사이의 거리와, 같은 시각 막대 그림자로 구한 두 지점의 중심각(각도 차이)을 측정해야 한다."},{"q":"'우주 날씨 예보'가 필요한 까닭을 태양 활동과 지구에 미치는 영향을 이용하여 쓰시오.","r":[[4,"태양 활동(플레어 등)으로 강한 에너지와 입자가 방출됨","플레어/입자/태양풍/폭발/흑점/코로나"],[4,"통신 장애, 위성 고장, 정전 등에 대비해야 함","통신|위성|전력/정전|gps/위치|항공"]],"m":"태양 활동이 활발하면 플레어 등으로 강한 에너지와 입자가 지구로 날아온다. 이 때문에 무선 통신 장애나 인공위성 고장, 정전이 생길 수 있어 미리 대비해야 한다."},{"q":"토성의 평균 밀도가 물보다 작은 까닭을 목성형 행성의 특징과 관련지어 쓰시오.","r":[[4,"토성의 밀도가 물보다 작음을 씀","밀도"],[4,"목성형 행성은 주로 가벼운 기체(수소, 헬륨)로 이루어짐","기체/수소/헬륨/가벼운"]],"m":"토성은 목성형 행성으로 주로 수소, 헬륨 같은 가벼운 기체로 이루어져 있다. 그래서 크기에 비해 질량이 작아 평균 밀도가 물보다 작다."}]]}];

<script>
(function(){
"use strict";
const UNITS = window.ARC_UNITS || [];
const SETS = [{k:"A",n:"개념 확인"},{k:"B",n:"자료 해석"},{k:"C",n:"생활 적용"}];
const BO = ["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"];
const NUM = ["①","②","③","④","⑤"];
const MC_PT = 4, SA_PT = 8;
const CFG = Object.assign({scoreUrl:"", token:""}, window.ARC_CONFIG || {});
const app = document.getElementById("app");

const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const S = {
  student: store.get("arc-student", null),
  limit: store.get("arc-limit", 45),
  exam: store.get("arc-exam", null),
  log: store.get("arc-log", [])
};
let timerId = null;

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = sel => app.querySelector(sel);
const unitOf = id => UNITS.find(u => u.id === id);
const isSA = it => Array.isArray(it.r);
const fmtTime = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec/60), s = sec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); };
const whoLine = st => `${st.grade}학년 ${st.cls}반 ${st.num}번`;

/* ---------- 서술형 핵심어 채점 ---------- */
function norm(s){
  return String(s||"").toLowerCase()
    .replace(/(\d+)\s*\/\s*(\d+)/g, "$2분의$1")
    .replace(/[\s·,.()'"“”‘’~_\-:;!?]/g, "");
}
function hitAlt(t, alt){ return alt.split("&").every(part => t.includes(norm(part))); }
function gradeSA(item, ans){
  const t = norm(ans);
  let score = 0;
  const res = item.r.map(([p, desc, kw, need]) => {
    need = need || 1;
    const ok = t.length > 0 && kw.split("|").filter(g => g.split("/").some(a => hitAlt(t, a))).length >= need;
    if (ok) score += p;
    return {p, desc, ok};
  });
  return {score, res};
}

/* ---------- 점수 저장: 선생님 점수표 전송, CSV ---------- */
const pad2 = n => String(n).padStart(2,"0");
const fmtDate = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function payloadOf(rec){
  const u = unitOf(rec.uid), st = rec.student;
  return {
    token: CFG.token, id: rec.id, at: rec.at,
    grade: st.grade, cls: st.cls, num: st.num, name: st.name,
    unit: u ? `${u.no}. ${u.title}` : rec.uid, set: `${SETS[rec.si].k}형 ${SETS[rec.si].n}`,
    mc: rec.mc, sa: rec.sa, total: rec.total,
    usedText: fmtTime(rec.used), limit: rec.limit, leaves: rec.leaves, auto: !!rec.auto,
    wrong: rec.detail.filter(d => d.type==="mc" && !d.ok).map(d => d.k),
    sa_items: rec.detail.filter(d => d.type==="sa").map(d => ({k:d.k, score:d.score, text:d.text})),
    version: window.ARC_VERSION || ""
  };
}
const outbox = () => store.get("arc-outbox", []);
const dropOut = id => store.set("arc-outbox", outbox().filter(x => x !== id));
function saveText(rec){
  if (!CFG.scoreUrl) return {c:"", t:"이 기기에 저장됨"};
  if (rec.sent) return {c:"ok", t:"선생님 점수표에 저장됨"};
  if (!navigator.onLine) return {c:"wait", t:"이 기기에 저장됨, 인터넷이 연결되면 선생님 점수표로 보냅니다"};
  if (rec.sendErr) return {c:"wait", t:"점수표 전송 실패, 자동으로 다시 보냅니다"};
  return {c:"wait", t:"선생님 점수표로 보내는 중"};
}
function paintSave(rec){
  const el = document.querySelector(`.savestate[data-id="${rec.id}"]`);
  if (!el) return;
  const x = saveText(rec); el.className = "savestate " + x.c; el.textContent = x.t;
}
let flushing = false;
async function flush(){
  if (!CFG.scoreUrl || flushing || !navigator.onLine) return;
  const box = outbox(); if (!box.length) return;
  flushing = true;
  for (const id of box) {
    const rec = S.log.find(l => l.id === id);
    if (!rec) { dropOut(id); continue; }
    try {
      const r = await fetch(CFG.scoreUrl, {method:"POST", body: JSON.stringify(payloadOf(rec))});
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "저장 실패");
      rec.sent = true; delete rec.sendErr; store.set("arc-log", S.log); dropOut(id);
    } catch (e) {
      rec.sendErr = String(e && e.message || e); store.set("arc-log", S.log); paintSave(rec); break;
    }
    paintSave(rec);
  }
  flushing = false;
  const pend = document.getElementById("pending"); if (pend) pend.textContent = pendingText();
}
function queueSend(rec){
  if (!CFG.scoreUrl) return;
  const box = outbox(); if (!box.includes(rec.id)) { box.push(rec.id); store.set("arc-outbox", box); }
  flush();
}
const pendingText = () => { const n = outbox().length; return CFG.scoreUrl ? (n ? `보내지 못한 점수 ${n}건` : "모든 점수를 선생님 점수표에 보냈습니다") : ""; };
function downloadCSV(list, fname){
  const head = ["제출 시각","학년","반","번호","이름","단원","유형","선택형(60)","서술형(40)","총점","걸린 시간","제한 시간(분)","화면 이탈","자동 제출","선택형 오답 번호","16번 점수","17번 점수","18번 점수","19번 점수","20번 점수","16번 답안","17번 답안","18번 답안","19번 답안","20번 답안"];
  const rows = list.map(l => { const p = payloadOf(l);
    return [fmtDate(new Date(l.at)), p.grade, p.cls, p.num, p.name, p.unit, p.set, p.mc, p.sa, p.total, p.usedText, p.limit, p.leaves, p.auto?"예":"", p.wrong.join(" "),
      ...p.sa_items.map(x => x.score), ...p.sa_items.map(x => x.text)]; });
  const csv = "\ufeff" + [head, ...rows].map(r => r.map(c => `"${String(c == null ? "" : c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = fname; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function renderData(d){
  if (!d) return "";

  if (lines.every(l => l.trim().startsWith("|"))) {
    const rows = lines.map(l => l.trim().replace(/^\||\|$/g,"").split("|").map(c => c.trim()));
    return `<div class="data"><table>${rows.map((r,i)=>`<tr>${r.map(c=> i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  }
  return `<div class="data">${esc(d)}</div>`;
}

function answered(k){ const a = S.exam.answers[k]; return a != null && String(a).trim() !== ""; }
function paintTicks(){
  const items = unitOf(S.exam.uid).sets[S.exam.si];

  app.querySelectorAll(".tick").forEach(t => { const on = answered(t.dataset.j); t.classList.toggle("on", on); if (on) c++; });
  const l = $("#left"); if (l) l.textContent = `${c} / ${items.length} 문항 작성`;
}
function startTimer(){
  stopTimer();
  const tick = () => {
    if (!S.exam) return stopTimer();
    const left = (S.exam.deadline - Date.now())/1000;
    const el = $("#tm");
    if (el) { el.firstChild.nodeValue = fmtTime(left); el.classList.toggle("low", left <= 300); }
    if (left <= 0) { stopTimer(); submitExam(true); }
  };
  tick(); timerId = setInterval(tick, 1000);
}
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }

function askSubmit(){
  const items = unitOf(S.exam.uid).sets[S.exam.si];
  const empty = items.map((_,i)=>i+1).filter(k => !answered(k));
  modal(`
    <h3>답안을 제출할까요?</h3>
    <p>${empty.length ? `아직 적지 않은 문항: <b>${empty.join(", ")}번</b>` : "모든 문항에 답을 적었습니다."}</p>

  `, (m, close) => {
    m.querySelector("[data-x]").onclick = close;
    m.querySelector("[data-go]").onclick = () => { close(); submitExam(false); };
  });
}

function submitExam(auto){
  const ex = S.exam; if (!ex) return;
  stopTimer();
  const u = unitOf(ex.uid), items = u.sets[ex.si];
  let mc = 0, sa = 0;
  const detail = items.map((it,i) => {
    const k = i+1, a = ex.answers[k];
    if (!isSA(it)) { const ok = a === it.a; if (ok) mc += MC_PT; return {k, type:"mc", pick:a||null, ok}; }
    const g = gradeSA(it, a); sa += g.score; return {k, type:"sa", text:a||"", score:g.score, res:g.res};
  });
  const rec = {
    id: Date.now().toString(36), uid:ex.uid, si:ex.si, who:keyWho(), student:{...S.student},
    mc, sa, total: mc+sa, auto, leaves: ex.leaves,
    used: Math.min(ex.limit*60, Math.round((Date.now()-ex.startAt)/1000)), limit: ex.limit,
    at: new Date().toISOString(), detail
  };
  rec.sent = false;
  S.log.unshift(rec); S.log = S.log.slice(0, 300); store.set("arc-log", S.log);
  S.exam = null; store.del("arc-exam");
  viewResult(rec);
  queueSend(rec);
}

    </div>
    <h2 class="shelf-title">응시 기록</h2>
    <p class="shelf-note">이 기기에서 제출한 시험지가 최근 순서로 보관됩니다. 줄을 누르면 결과지를 다시 볼 수 있습니다.</p>
    <div class="logtools">
      <button class="btn ghost" id="csvMine" ${mine.length?"":"disabled"}>내 점수 파일로 저장</button>
      <button class="btn ghost" id="csvAll" ${S.log.length?"":"disabled"}>이 기기 전체 점수 저장</button>
      ${CFG.scoreUrl ? `<button class="btn ghost" id="resend" ${outbox().length?"":"disabled"}>점수표로 다시 보내기</button><span class="muted" id="pending" style="align-self:center;font-size:14px">${pendingText()}</span>` : ""}
    </div>
    <div class="sheet tblwrap">${mine.length ? `
      <table class="logtbl"><thead><tr><th>제출 시각</th><th>단원</th><th>유형</th><th>선택형</th><th>서술형</th><th>총점</th><th>이탈</th><th>저장</th></tr></thead>
      <tbody>${mine.map(l => { const u = unitOf(l.uid), d = new Date(l.at); return `<tr style="cursor:pointer" data-id="${l.id}" tabindex="0">
        <td>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</td>
        <td>${esc(u?u.title:l.uid)}</td><td>${SETS[l.si].k}형</td><td>${l.mc}</td><td>${l.sa}</td><td><b>${l.total}</b></td><td>${l.leaves}</td><td>${!CFG.scoreUrl ? "기기" : l.sent ? "점수표" : "대기"}</td></tr>`; }).join("")}</tbody></table>`
      : `<p>아직 제출한 시험지가 없습니다. 서가에서 단원 서랍을 골라 첫 시험지를 풀어 보세요.</p>`}
    </div>
  </div>`;
  $("#back").onclick = viewShelf;
  const stamp = new Date(); const tag = `${stamp.getFullYear()}${pad2(stamp.getMonth()+1)}${pad2(stamp.getDate())}`;
  const bm = $("#csvMine"); if (bm) bm.onclick = () => downloadCSV(mine, `science1-scores-${S.student.grade}-${S.student.cls}-${S.student.num}-${tag}.csv`);
  const ba = $("#csvAll"); if (ba) ba.onclick = () => downloadCSV(S.log, `science1-scores-device-${tag}.csv`);
  const rs = $("#resend"); if (rs) rs.onclick = () => { rs.disabled = true; flush().then(viewLog); };
  app.querySelectorAll("tr[data-id]").forEach(tr => {
    const open = () => viewResult(S.log.find(l => l.id === tr.dataset.id), true);
    tr.onclick = open; tr.onkeydown = e => { if (e.key === "Enter") open(); };
  });
}

/* ---------- 이탈 감지, 새로고침 보호 ---------- */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && S.exam) { S.exam.leaves++; saveExam(); }
});
window.addEventListener("beforeunload", e => { if (S.exam && !window.__arcReloading) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- 시작 ---------- */
if (S.exam && S.student && unitOf(S.exam.uid)) {
  if (Date.now() >= S.exam.deadline) submitExam(true); else viewExam();
} else if (S.student) viewShelf(); else viewCover();
flush();
})();
</script>
<div id="appbar" class="appbar hidden" role="status" aria-live="polite"></div>
<script>
(function(){
  "use strict";
  var VER="1.1.0", bar=document.getElementById("appbar"), deferred=null;
  function show(msg, label, onClick){
    bar.innerHTML='<span>'+msg+'</span>'+(label?'<button type="button" data-a>'+label+'</button>':'')+'<button type="button" class="x" data-x aria-label="닫기">닫기</button>';
    bar.classList.remove("hidden");
    if(label) bar.querySelector("[data-a]").onclick=onClick;
    bar.querySelector("[data-x]").onclick=function(){ bar.classList.add("hidden"); };
  }
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred=e;
    show("이 기기에 앱으로 설치하면 인터넷 없이도 시험을 볼 수 있습니다.","앱 설치",function(){
      bar.classList.add("hidden"); deferred.prompt(); deferred=null;
    });
  });
  window.addEventListener("appinstalled", function(){ show("앱을 설치했습니다. 홈 화면에서 열 수 있습니다."); });
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      function offer(w){
        show("새 버전(문항 수정 등)이 준비되었습니다.","지금 적용",function(){
          window.__arcReloading=true; w.postMessage("SKIP_WAITING");
        });
      }
      if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener("updatefound", function(){
        var w=reg.installing; if(!w) return;
        w.addEventListener("statechange", function(){
          if(w.state==="installed" && navigator.serviceWorker.controller) offer(w);
        });
      });
      setInterval(function(){ reg.update().catch(function(){}); }, 30*60*1000);
    }).catch(function(){});
    var done=false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(done) return; done=true; window.__arcReloading=true; location.reload();
    });
  });
  window.ARC_VERSION=VER;
})();
</script>
</body>
